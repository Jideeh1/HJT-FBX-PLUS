schema_version = "1.0.0"

id = "hjt_fbx_plus"
version = "1.2.0"
name = "HJT FBX+"
tagline = "Advanced FBX & UEModel Game Asset Importer"
maintainer = "HJT Studio"
type = "add-on"

website = "https://github.com/Jideeh1/HJT-FBX-PLUS"

tags = ["Import-Export"]

blender_version_min = "4.2.0"

license = [
  "SPDX:GPL-3.0-or-later",
]
copyright = [
  "2026 HJT Studio",
]

[permissions]
files = "Import FBX files or FBX inside ZIP/7Z/RAR archives (extracted to a temporary cache), save profiles and reports"
network = "Checks GitHub (github.com/Jideeh1/HJT-FBX-PLUS) for new releases and downloads updates; optional pip packages for exotic 7z archives when you press Install"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "*.pyc",
  "*.part",
]
